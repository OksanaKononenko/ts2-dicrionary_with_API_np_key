<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TypeScript Словник без бекенду з АПІ</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        input, button { padding: 8px; font-size: 16px; }
        .result-box { margin-top: 20px; padding: 15px; border: 1px solid #ccc; width: 300px; }
    </style>
</head>
<body>

    <h2>Англійський словник (TypeScript + Frontend + API)</h2>
    <input type="text" id="wordInput" placeholder="Введіть слово (наприклад, cat)">
    <button id="searchBtn">Шукати</button>

    <div class="result-box" id="resultContainer" style="display: none;">
        <h3 id="wordTitle"></h3>
        <p><strong>Визначення:</strong> <span id="wordDef"></span></p>
    </div>
<script type="module" src="./app.js"></script>
</body>
</html>
